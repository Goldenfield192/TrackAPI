buildscript {
    repositories {
        maven { url = "https://teamopenindustry.cc/maven" }
    }
    dependencies {
        classpath 'cam72cam.universalmodcore:UniversalModCoreGradle:0.1.3'
    }
}

plugins {
    id 'java'
    id 'maven-publish'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
}

import cam72cam.universalmodcore.Util

String baseVersion = project.mod_version
if (!"release".equalsIgnoreCase(System.getProperty("target"))) {
    baseVersion += "-" + Util.GitRevision()
}
version = "1.12.2-forge-" + baseVersion
group = project.mod_id // http://maven.apache.org/guides/mini/guide-naming-conventions.html
base.archivesName = project.archive_name

// this is just here so we can test the outputs easier and clean between tests
unimined.useGlobalCache = false

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

sourceSets {
    forge {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    maven {
        name = "wagyourtail releases"
        url = "https://maven.wagyourtail.xyz/releases"
    }
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven"
    }
    mavenCentral()
}

unimined.minecraft {
    version project.minecraft_version

    mappings {
        searge()
        mcp("stable", "39-1.12")
    }

    defaultRemapJar = false
}

unimined.minecraft(sourceSets.forge) {
    combineWith(sourceSets.main)

    minecraftForge {
        loader project.forge_version
    }

    defaultRemapJar = true
}

configurations {
    mainImplementation
    implementation {
        extendsFrom forgeImplementation
    }
}

sourceSets {
    main {
        compileClasspath += configurations.mainImplementation
        runtimeClasspath += configurations.mainImplementation
    }
}

dependencies {
}

jar {
    enabled = false
}

processForgeResources {
    inputs.property "version", project.mod_version
    inputs.property "mcversion", project.minecraft_version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.mod_version, 'mcversion':project.minecraft_version
    }

    filesMatching("mcmod.info") {
        expand "version": project.mod_version, 'mcversion':project.minecraft_version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifactId project.archive_name
        }
    }
    repositories {
        maven {
            url "sftp://teamopenindustry.cc:22/var/www/html/maven/"
            credentials {
                username = "mavenci"
                password = System.getenv("MAVENCI_PASS")
            }
        }
    }
}