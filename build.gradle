import cam72cam.universalmodcore.Util;

buildscript {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = "https://teamopenindustry.cc/maven" }
        maven { url "https://plugins.gradle.org/m2/" }
        mavenCentral()
    }
    dependencies {
        classpath "net.neoforged.moddev:net.neoforged.moddev.gradle.plugin:2.0.116"
        classpath "gradle.plugin.com.github.johnrengelman:shadow:7.1.0"
        classpath 'cam72cam.universalmodcore:UniversalModCoreGradle:0.1.3'
    }
}

apply plugin: 'net.neoforged.moddev'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
//apply plugin: 'maven'
apply plugin: 'maven-publish'
apply plugin: 'com.github.johnrengelman.shadow'

java.toolchain.languageVersion = JavaLanguageVersion.of(17) // Mojang ships Java 8 to end users, so your mod should target Java 8.

String baseVersion = "1.2"
if (!"release".equalsIgnoreCase(System.getProperty("target"))) {
    baseVersion += "-" + Util.GitRevision()
}
version = "1.20.4-neoforge-" + baseVersion
group = "trackapi" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "TrackAPI"

neoForge {
    version = "20.4.251"

    parchment {
        mappingsVersion = "2024.04.14"
        minecraftVersion = "1.20.4"
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', "trackapi"
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', "trackapi"
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', "trackapi"
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', "trackapi", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

//        junit {
//            type = "client"
//            systemProperty 'neoforge.enabledGameTestNamespaces', "trackapi"
//        }

        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "trackapi" {
            sourceSet(sourceSets.main)
        }
    }
//    unitTest {
//        // Enable JUnit support in the moddev plugin
//        enable()
//        // Configure which mod is being tested.
//        // This allows NeoForge to load the test/ classes and resources as belonging to the mod.
//        testedMod = mods."trackapi" // <mod name> must match the name in the mods { } block.
//        // Configure which mods are loaded in the test environment, if the default (all declared mods) is not appropriate.
//        // This must contain testedMod, and can include other mods as well.
//        // loadedMods = [mods.<mod name >, mods.<mod name 2>]
//    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
//    implementation "net.neoforged:neoforge:20.4.251"

    // You may put jars on which you depend on in ./libs or you may define them like so..
    // compile "some.group:artifact:version:classifier"
    // compile "some.group:artifact:version"

    // Real examples
    // compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    // compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // The 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    // provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // These dependencies get remapped to your current MCP mappings
    // deobf 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
            "Specification-Title": "trackapi",
            "Specification-Vendor": "trackapi",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${archiveVersion}",
            "Implementation-Vendor" :"trackapi",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "sftp://teamopenindustry.cc:22/var/www/html/maven/"
            credentials {
                username = "mavenci"
                password = System.getenv("MAVENCI_PASS")
            }
        }
    }
}




